<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 266" width="860" height="266" role="img" aria-label="Columns by classification level per data contract" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title>Columns by classification level per data contract</title><style>
  .surface { fill: #fcfcfb; } .card { fill: #ffffff; stroke: rgba(11,11,11,0.10); }
  .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; } .none { fill: #f0efec; }
  .s1 { fill: #86b6ef; } .s2 { fill: #3987e5; } .s3 { fill: #1c5cab; } .s4 { fill: #0d366b; }
  .on-light { fill: #0b0b0b; } .on-dark { fill: #ffffff; } .good { fill: #0ca30c; } .good-text { fill: #006300; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .card { fill: #222221; stroke: rgba(255,255,255,0.10); }
    .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .grid { stroke: #2c2c2a; } .none { fill: #2c2c2a; }
    .s1 { fill: #184f95; } .s2 { fill: #256abf; } .s3 { fill: #3987e5; } .s4 { fill: #86b6ef; }
    .on-light { fill: #ffffff; } .good-text { fill: #0ca30c; }
    text.on-s4 { fill: #0b0b0b; }
  }
</style>
<rect class="surface" width="860" height="266" rx="12"/>
<text x="24" y="34" class="ink" font-size="17" text-anchor="start" font-weight="600">Every column classified, every PII column typed</text>
<text x="24" y="56" class="ink2" font-size="12" text-anchor="start" font-weight="400">Columns per data contract by classification level (from the ODCS contracts).</text>
