name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy:
    name: Validate policy and test engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m gov_engine validate
      - name: Render plan and access matrix
        run: |
          mkdir -p plan
          for env in dev prod; do
            python -m gov_engine plan --env "$env" > "plan/$env.sql"
            python -m gov_engine matrix --env "$env" > "plan/$env-access-matrix.md"
          done
          cat plan/prod-access-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: governance-plan
          path: plan/

  bundle:
    name: Validate bundle
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.22.1
        if: env.DATABRICKS_CLIENT_ID != ''
      - if: env.DATABRICKS_CLIENT_ID != ''
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t prod
      - if: env.DATABRICKS_CLIENT_ID == ''
        run: echo "::notice::gov-deployer secrets not set - skipping bundle validation"
