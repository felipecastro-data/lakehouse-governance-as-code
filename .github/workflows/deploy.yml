# Promotion dev -> test -> prod on one commit (docs/adr/0011-three-stage-promotion.md).
#
#   push to main            dev: deploy + apply governance
#   dispatch target=dev     dev (+ pipeline if run_pipeline)
#   dispatch target=test    dev -> test           (+ pipelines if run_pipeline; run_pipeline=false
#                                                    bootstraps a new test catalog)
#   dispatch target=prod    dev + pipeline -> test + pipeline -> [approval] -> prod (+ pipeline if
#                           run_pipeline). Each pipeline run is a gate: any failed task (quality,
#                           drift, PII propagation, erasure check) stops the promotion.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Promote up to this target (dev -> test -> prod)
        type: choice
        options: [dev, test, prod]
        default: dev
      run_pipeline:
        description: Run the pipeline in the last target (always runs in dev and test when promoting to prod)
        type: boolean
        default: false

# One deploy at a time across all targets: a promotion and a push to main both deploy dev.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TARGET: ${{ github.event.inputs.target || 'dev' }}
  # OAuth M2M as the gov-deployer service principal (docs/adr/0006-deploy-service-principal.md)
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  dev:
    # Enable once the gov-deployer secrets exist: repo variable DEPLOY_ENABLED=true
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-target
        with:
          target: dev
          run_pipeline: ${{ env.TARGET == 'prod' || github.event.inputs.run_pipeline == 'true' }}

  test:
    needs: dev
    if: github.event.inputs.target == 'test' || github.event.inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: test  # no approval: the pipeline run is the gate
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-target
        with:
          target: test
          run_pipeline: ${{ env.TARGET == 'prod' || github.event.inputs.run_pipeline == 'true' }}

  prod:
    needs: test
    if: github.event.inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: prod  # requires approval
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-target
        with:
          target: prod
          run_pipeline: ${{ github.event.inputs.run_pipeline == 'true' }}
