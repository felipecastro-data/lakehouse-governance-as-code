# Classification scheme and the controls attached to each level.
# Levels, PII types and row filter keys become governed tags; masks are attached by ABAC
# policies that match those tags. See docs/adr/0005-native-abac.md

# Ordered from least to most sensitive.
levels:
  public:
    description: Safe to publish.
    unmasked_for: all
  internal:
    description: Business data, no personal information.
    unmasked_for: all
  confidential:
    description: Personal data (GDPR personal data). Masked by default.
    unmasked_for: [pii_readers, pii_restricted_readers, pipelines]   # rendered as the policy's EXCEPT clause
  restricted:
    description: Highly sensitive (government IDs, payment cards). Masked or pseudonymized.
    unmasked_for: [pii_restricted_readers, pipelines]

# Mask expressions receive the column value as `v` and must return the same type.
mask_strategies:
  partial_email:
    data_type: STRING
    expression: "regexp_replace(v, '^(.)[^@]*', '$1***')"
  last4:
    data_type: STRING
    expression: "concat(repeat('*', greatest(length(v) - 4, 0)), right(v, 4))"
  initial_only:
    data_type: STRING
    expression: "concat(left(v, 1), '.')"
  redact:
    data_type: STRING
    expression: "'***REDACTED***'"
  sha256:
    data_type: STRING
    expression: "sha2(v, 256)"
  year_only:
    data_type: DATE
    expression: "make_date(year(v), 1, 1)"

# Each PII type has a minimum classification level and a mask strategy.
# `system_tags`: Databricks data-classification tags that trigger the same mask, so columns found
# by automatic classification are protected even before a contract declares them.
pii_types:
  person_name:
    classification: confidential
    strategy: initial_only
    system_tags: [class.name]
  email:
    classification: confidential
    strategy: partial_email
    system_tags: [class.email_address]
  phone:
    classification: confidential
    strategy: last4
    system_tags: [class.phone_number]
  street_address:
    classification: confidential
    strategy: redact
    system_tags: [class.street_address, class.location]
  date_of_birth:
    classification: confidential
    strategy: year_only
    # no system_tags: auto-classified birth dates may be STRING, and this mask takes a DATE
  national_id:
    classification: restricted
    strategy: sha256   # pseudonymized: still joinable, not reversible
    system_tags: [class.us_ssn, class.passport, class.driver_license]
  card_number:
    classification: restricted
    strategy: last4
    system_tags: [class.credit_card]
