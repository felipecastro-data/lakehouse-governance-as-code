# Open Data Contract Standard (ODCS) v3 — subset. Governance metadata lives in customProperties.
apiVersion: v3.0.2
kind: DataContract
id: customer.customer_360
name: customer_360
version: 0.1.0
status: draft
domain: customer
dataProduct: customer_360
description:
  purpose: Gold data product — customer profile with order KPIs, for analysts.
customProperties:
  - property: owner
    value: customer_stewards
schema:
  - name: customer_360
    physicalName: customer_gold.customer_360
    physicalType: table
    customProperties:
      - property: rowFilter
        value: region
    properties:
      - name: customer_id
        logicalType: string
        primaryKey: true
        required: true
        classification: internal
      - name: full_name
        logicalType: string
        customProperties:
          - property: piiType
            value: person_name
      - name: email
        logicalType: string
        customProperties:
          - property: piiType
            value: email
      - name: region
        logicalType: string
        required: true
        classification: internal
      - name: order_count
        logicalType: integer
        classification: internal
      - name: lifetime_value
        logicalType: number
        classification: internal
      - name: last_order_ts
        logicalType: timestamp
        classification: internal
slaProperties:
  - property: frequency
    value: daily
