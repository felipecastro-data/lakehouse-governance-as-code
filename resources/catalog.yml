# One catalog per environment (docs/adr/0001). Owned by whoever deploys: the deploy service
# principal in CI. No grants here: access is owned by gov_engine (docs/adr/0002).
resources:
  catalogs:
    lakehouse:
      name: ${var.catalog}
      comment: Governed lakehouse (${bundle.target}). Access, tags and policies managed by gov_engine.
