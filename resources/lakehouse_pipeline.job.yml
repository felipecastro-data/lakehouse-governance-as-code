# Synthetic data -> bronze -> erasure register re-applied -> silver -> gold, then the contracts' quality rules,
# drift, PII propagation and erasure checks, and the governance scorecard.
# Runs as the deployer (gov-deployer), a member of gov-pipeline-runners, which the ABAC policies
# exempt so silver and gold are built from clear data (docs/adr/0007).
resources:
  jobs:
    lakehouse_pipeline:
      name: lakehouse-pipeline-${bundle.target}
      description: Builds the governed lakehouse. Governance is applied first, so every contract table exists and is tagged before data lands.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: governance
          run_job_task:
            job_id: ${resources.jobs.governance_apply.id}

        - task_key: bronze
          depends_on: [{task_key: governance}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/generate_bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        # Sources re-deliver erased people, so the register is applied to every ingestion (docs/adr/0010).
        - task_key: erasure
          depends_on: [{task_key: bronze}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/erasure.py
            parameters: ["--env", "${bundle.target}", "--root", "${workspace.file_path}", "--run-id", "{{job.run_id}}"]

        - task_key: silver_customers
          depends_on: [{task_key: erasure}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/run_sql.py
            parameters: ["--catalog", "${var.catalog}", "--file", "${workspace.file_path}/src/transforms/customer_silver/customers.sql"]

        - task_key: silver_orders
          depends_on: [{task_key: silver_customers}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/run_sql.py
            parameters: ["--catalog", "${var.catalog}", "--file", "${workspace.file_path}/src/transforms/sales_silver/orders.sql"]

        - task_key: gold_customer_360
          depends_on: [{task_key: silver_orders}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/run_sql.py
            parameters: ["--catalog", "${var.catalog}", "--file", "${workspace.file_path}/src/transforms/customer_gold/customer_360.sql"]

        - task_key: quality
          depends_on: [{task_key: gold_customer_360}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/check_quality.py
            parameters: ["--env", "${bundle.target}", "--root", "${workspace.file_path}"]

        # Verification (docs/adr/0008): runs after the data, so it sees this run's tables and tags.
        - task_key: drift
          depends_on: [{task_key: quality}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/check_drift.py
            parameters: ["--env", "${bundle.target}", "--root", "${workspace.file_path}"]

        - task_key: pii_propagation
          depends_on: [{task_key: quality}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/check_pii_propagation.py
            parameters: ["--env", "${bundle.target}", "--root", "${workspace.file_path}"]

        - task_key: erasure_check
          depends_on: [{task_key: quality}]
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/erasure.py
            parameters: ["--env", "${bundle.target}", "--root", "${workspace.file_path}", "--verify"]

        # Measurement (docs/adr/0009): records coverage and findings even when a check failed.
        - task_key: scorecard
          depends_on: [{task_key: drift}, {task_key: pii_propagation}, {task_key: erasure_check}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/build_scorecard.py
            parameters: ["--env", "${bundle.target}", "--root", "${workspace.file_path}", "--run-id", "{{job.run_id}}"]

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - pyyaml>=6
