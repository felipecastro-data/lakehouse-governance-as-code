# Databricks Asset Bundle. The bundle owns infrastructure (schemas, jobs, dashboards);
# gov_engine owns access policy (grants, tags, masks, row filters). See docs/adr/0002.
#
# Auth: locally a CLI profile (`databricks auth login`); in CI the gov-deployer service principal
# via OAuth M2M (DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET). See docs/adr/0006.
bundle:
  name: lakehouse-governance

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the target (must match governance/layout.yml).

# No `mode:` on purpose: development mode prefixes schema names, which would break the
# policy's schema selectors. Behaviour is set explicitly with presets instead.
targets:
  dev:
    default: true
    variables:
      catalog: gov_dev
    presets:
      trigger_pause_status: PAUSED
      tags:
        environment: dev

  prod:
    variables:
      catalog: gov_prod
    # Default root path = the deployer's home folder (gov-deployer in CI), so no one else can edit
    # the deployed files. /Workspace/Shared would be writable by every workspace user.
    presets:
      trigger_pause_status: UNPAUSED
      tags:
        environment: prod
